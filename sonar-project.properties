# ──────────────────────────────────────────────────────────────────────────
#  SonarQube — Configuración del Proyecto vg-ms-attendanceTeacher
#  Se usa como referencia; los valores son sobreescritos por el Jenkinsfile.
# ──────────────────────────────────────────────────────────────────────────

# Identificación del proyecto
sonar.projectKey=vg-ms-attendanceTeacher
sonar.projectName=VG MS Attendance Teacher
sonar.projectVersion=0.0.1-SNAPSHOT

# Fuentes
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=17
sonar.java.target=17

# Binarios y cobertura
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusiones (no analizar generados ni config)
sonar.exclusions=\
  **/generated/**,\
  **/*Application.java,\
  **/*Config.java,\
  **/*Configuration.java,\
  **/dto/**,\
  **/mapper/**,\
  **/exception/**

# Exclusiones de cobertura
sonar.coverage.exclusions=\
  **/*Application.java,\
  **/*Config*.java,\
  **/dto/**,\
  **/mapper/**,\
  **/model/**

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate — umbrales para este proyecto
# (Configurar en la UI de SonarQube; aquí como referencia)
# - Coverage mínimo:           70%
# - Duplicated lines:          < 10%
# - Code smells nuevos:        0 bloqueantes
# - Bugs críticos nuevos:      0
# - Vulnerabilidades nuevas:   0
